[package]
name = "clearframe-native"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false

[features]
default = ["metal"]
metal = ["dep:fframes_skia_renderer"]

[dependencies]
fframes = { git = "https://github.com/dmtrKovalenko/fframes", rev = "bacfc3c3212d3d9429468435bfdc1ae2a21c7b3b", features = ["cli", "compile-time-svgtree", "h264", "libav-agree-gpl"] }
# The same shaper usvgr renders with, already in the lock graph; used for exact text metrics.
rustybuzz = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(target_os = "macos")'.dependencies]
fframes_skia_renderer = { git = "https://github.com/dmtrKovalenko/fframes", rev = "bacfc3c3212d3d9429468435bfdc1ae2a21c7b3b", features = ["metal"], optional = true }

[profile.release]
debug = false
lto = false

[patch."https://github.com/dmtrKovalenko/fframes"]
fframes-media = { path = "vendor/fframes-media" }

[workspace]
